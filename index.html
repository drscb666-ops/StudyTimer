<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Timer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f7d5b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Timer">
<style>
*{box-sizing:border-box}
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2320;--mut:#6b746f;--line:#e4e2da;--acc:#2f7d5b;--acc2:#e0894a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--card:#1b211e;--ink:#eef2ef;--mut:#95a19a;--line:#2b3430;--acc:#5fc394;--acc2:#f0a566}}
:root[data-theme="dark"]{--bg:#121614;--card:#1b211e;--ink:#eef2ef;--mut:#95a19a;--line:#2b3430;--acc:#5fc394;--acc2:#f0a566}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:1.25rem;margin:0}h3{margin:0 0 10px;font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:0 18px}
button:disabled{opacity:.4;cursor:default}
.tabs,.seg{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:14px}
.tabs button,.seg button{flex:1;border:0;background:transparent;border-radius:10px;min-height:38px;padding:0 14px}
.tabs .on,.seg .on{background:var(--card);font-weight:600;box-shadow:0 1px 3px #0003}
.seg{margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;position:relative}
.center{text-align:center}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px;width:100%}
#subj{text-align:center;max-width:380px}
.phase{margin:14px 0 4px;color:var(--mut);font-weight:600;letter-spacing:.03em}
.ringbox{position:relative;width:min(80vw,340px);aspect-ratio:1;margin:6px auto}
.ringbox svg{width:100%;height:100%}
.bg{fill:none;stroke:var(--line);stroke-width:8}
.fg{fill:none;stroke:var(--acc);stroke-width:8;stroke-linecap:round;stroke-dasharray:565.49;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:100px 100px;transition:stroke-dashoffset .3s linear}
.brk .fg{stroke:var(--acc2)}
.dig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(2.3rem,11vw,3.7rem);font-weight:700;font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;min-width:150px;min-height:52px;font-weight:700;font-size:1.05rem}
.fs{position:absolute;right:12px;top:12px;min-height:38px;padding:0 10px;border:0;background:transparent;color:var(--mut)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.mut{color:var(--mut);font-size:.85rem;margin:8px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips button{min-height:36px;padding:0 14px;border-radius:20px}
.today{text-align:center;color:var(--mut);font-size:.9rem}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;text-align:center}
.nav button{width:48px;padding:0}
.cards4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:600px){.cards4{grid-template-columns:repeat(4,1fr)}}
.k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.k b{display:block;font-size:1.25rem}.k span{color:var(--mut);font-size:.8rem}
.chart{display:flex;gap:2px;align-items:flex-end;height:180px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer}
.bar i{display:block;background:var(--acc);border-radius:4px 4px 0 0;min-height:0}
.bar span{display:flex;justify-content:center;height:18px;font-size:.66rem;color:var(--mut);white-space:nowrap;padding-top:3px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row em{font-style:normal;font-weight:600}
.meter{grid-column:1/3;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.ses{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ses:first-child{border-top:0}.ses small{color:var(--mut);display:block}
.ses button{min-height:36px;width:36px;padding:0;border-radius:10px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:24px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style></head>
<body><div class="wrap">
<header><h1>⏱ Study Timer</h1><button id="inst" hidden style="min-height:38px;font-size:.85rem">Install app</button><button id="acct" hidden style="min-height:38px;font-size:.85rem">Sign in to sync</button><nav class="tabs"><button id="tT" class="on">Timer</button><button id="tA">Analysis</button></nav></header>
<section class="card" id="auth" hidden>
 <h3>Sync across devices</h3>
 <div style="display:grid;gap:8px">
  <input id="aE" type="email" placeholder="Email" autocomplete="email">
  <input id="aP" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <div class="ctl" style="margin:0"><button id="aIn" class="pri" style="min-width:0;flex:1">Sign in</button><button id="aUp" style="flex:1">Create account</button></div>
  <button id="aG">Continue with Google</button>
  <p id="aMsg" class="mut" style="margin:0"></p>
 </div>
</section>

<main id="vT">
 <div class="seg" id="modes"><button data-m="pomo">Pomodoro</button><button data-m="timer">Timer</button><button data-m="sw">Stopwatch</button></div>
 <section class="card center">
  <button id="fs" class="fs" title="Full screen">⛶</button>
  <input id="subj" list="subs" placeholder="What are you studying?" maxlength="60" autocomplete="off"><datalist id="subs"></datalist>
  <div id="phase" class="phase"></div>
  <div class="ringbox" id="rb"><svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="90"/><circle id="rg" class="fg" cx="100" cy="100" r="90"/></svg><div id="dig" class="dig">25:00</div></div>
  <div class="ctl"><button id="go" class="pri">Start</button><button id="stop" hidden>Finish &amp; save</button></div>
 </section>
 <section class="card">
  <div id="sPomo" class="grid3">
   <label>Focus (min)<input type="number" id="cF" min="1" max="240" inputmode="numeric"></label>
   <label>Break (min)<input type="number" id="cB" min="0" max="60" inputmode="numeric"></label>
   <label>Repeat (rounds)<input type="number" id="cR" min="1" max="20" inputmode="numeric"></label>
   <p id="plan" class="mut" style="grid-column:1/4"></p>
  </div>
  <div id="sTimer"><label>Duration (minutes)<input type="number" id="cT" min="1" max="600" inputmode="numeric"></label><div class="chips" id="chips"></div></div>
  <p id="sSw" class="mut" style="margin:0">Counts up from 0:00. Press “Finish &amp; save” when you stop and only the time you actually studied is recorded.</p>
 </section>
 <div class="today" id="today"></div>
</main>

<main id="vA" hidden>
 <div class="seg" id="rng"><button data-r="day">Day</button><button data-r="week">Week</button><button data-r="month">Month</button></div>
 <div class="nav"><button id="pv">‹</button><strong id="lbl"></strong><button id="nx">›</button></div>
 <div class="cards4" id="kpi"></div>
 <section class="card"><h3>Study time</h3><div class="chart" id="ch"></div><p id="tip" class="mut">Tap a bar for details</p></section>
 <section class="card"><h3>By subject</h3><div id="subjL"></div></section>
 <section class="card"><h3>Sessions</h3><div id="sesL"></div></section>
 <p class="mut center" style="text-align:center">Your data is saved in this browser on this device.</p>
</main>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},
 set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let sessions=store.get('st.sessions',[]);
let cfg=Object.assign({mode:'pomo',focus:25,brk:5,rounds:4,timer:45,subject:''},store.get('st.cfg',{}));
let A=null,R={range:'day',off:0};
const cl=()=>window.App&&window.App.cloud;
const saveCfg=()=>{store.set('st.cfg',cfg);cl()&&cl().cfg(cfg)};
const C=565.49;

/* formatting */
const pad=n=>String(n).padStart(2,'0');
function clock(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad(m):m)+':'+pad(s%60)}
function dur(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+pad(m)+'m':m?m+'m':s+'s'}
const MODE={pomo:'Pomodoro',timer:'Timer',sw:'Stopwatch'};

/* sound, wake lock, toast */
let ac,wl=null,tt;
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){try{unlock();[0,.25,.5].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+d;o.frequency.value=880;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.22)});navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
function unwake(){try{wl&&wl.release()}catch(e){}wl=null}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3000)}

/* sessions */
function add(sec,end,mode,subject){
  sec=Math.floor(sec);if(sec<5)return false;
  const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),end,dur:sec,mode,subject:(subject||'').trim()||'Unlabelled'};
  if(!(cl()&&cl().put(s)))s.pending=true;
  sessions.push(s);
  store.set('st.sessions',sessions);renderToday();fillSubjects();return true}
function fillSubjects(){$('#subs').innerHTML=[...new Set(sessions.map(s=>s.subject).filter(s=>s!=='Unlabelled'))].map(s=>`<option value="${esc(s)}">`).join('')}
function renderToday(){
  const n=new Date(),a=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),b=a+864e5;let sec=0,c=0;
  for(const s of sessions){const st=s.end-s.dur*1000,ov=Math.max(0,Math.min(s.end,b)-Math.max(st,a))/1000;if(ov){sec+=ov;c++}}
  $('#today').textContent=c?`Today: ${dur(sec)} studied · ${c} session${c>1?'s':''}`:'Nothing recorded today yet'}

/* timer engine (timestamp based, so it stays accurate in background tabs) */
const elapsed=()=>(A.el+(A.run?Date.now()-A.seg:0))/1000;
const persist=()=>store.set('st.active',A);
const targetOf=()=>cfg.mode==='sw'?0:cfg.mode==='timer'?cfg.timer*60:cfg.focus*60;
function start(){
  unlock();
  if(!A)A={mode:cfg.mode,phase:'focus',round:1,el:0,seg:0,run:false,subject:cfg.subject,target:targetOf(),beat:Date.now(),cfg:{focus:cfg.focus,brk:cfg.brk,rounds:cfg.rounds}};
  A.seg=Date.now();A.run=true;A.beat=Date.now();persist();wake();render()}
function pause(){A.el+=Date.now()-A.seg;A.run=false;persist();unwake();render()}
function stop(){
  if(!A)return;const e=elapsed();
  if(A.phase==='focus'){toast(add(e,Date.now(),A.mode,A.subject)?`Saved ${dur(e)} of study`:'Under 5 seconds — not saved')}
  A=null;store.set('st.active',null);unwake();render();renderT()}
function phaseDone(){
  if(A.phase==='focus')add(A.target,Date.now(),A.mode,A.subject);
  beep();
  if(A.mode==='pomo'){
    if(A.phase==='focus'){
      if(A.round>=A.cfg.rounds){toast('All rounds complete 🎉');A=null;store.set('st.active',null);unwake();renderT();return}
      if(A.cfg.brk>0){A.phase='break';A.target=A.cfg.brk*60}else{A.round++;A.target=A.cfg.focus*60}
    }else{A.phase='focus';A.round++;A.target=A.cfg.focus*60}
    A.el=0;A.seg=Date.now();persist();toast(A.phase==='break'?'Focus done — take a break':'Break over — back to focus')
  }else{toast('Time’s up 🎉 Session saved');A=null;store.set('st.active',null);unwake();renderT()}}

/* recover a session left open when the page was closed */
(function(){const s=store.get('st.active',null);if(!s)return;
 if(s.phase==='focus'){const e=s.el/1000+(s.run?Math.max(0,s.beat-s.seg)/1000:0);if(add(e,s.beat,s.mode,s.subject))setTimeout(()=>toast(`Recovered unfinished session: ${dur(e)}`),400)}
 store.set('st.active',null)})();

/* timer view */
function render(){
  let e=0,tg,ph='idle';
  if(A){e=elapsed();tg=A.target;ph=A.phase}else tg=targetOf();
  const d=tg?Math.max(0,Math.ceil(tg-e)):Math.floor(e);
  $('#dig').textContent=clock(d);
  const fr=tg?Math.min(1,e/tg):(e%60)/60;
  $('#rg').style.strokeDashoffset=tg?C*fr:C*(1-fr);
  $('#rb').classList.toggle('brk',ph==='break');
  let p=MODE[cfg.mode];
  if(A){p=A.mode==='pomo'?(ph==='break'?'Break · next is round '+(A.round+1):`Focus · Round ${A.round} of ${A.cfg.rounds}`):(A.run?'Studying…':'Paused');
    if(A.mode==='pomo'&&!A.run)p+=' (paused)'}
  $('#phase').textContent=p;
  $('#go').textContent=A&&A.run?'Pause':A?'Resume':'Start';
  $('#stop').hidden=!A;$('#stop').textContent=A&&A.phase==='break'?'End session':'Finish & save';
  document.title=A&&A.run?`${clock(d)} · ${ph==='break'?'Break':'Focus'}`:'Study Timer'}
function renderT(){
  const m=A?A.mode:cfg.mode;
  $$('#modes button').forEach(b=>{b.classList.toggle('on',b.dataset.m===m);b.disabled=!!A&&b.dataset.m!==m});
  $('#sPomo').hidden=m!=='pomo';$('#sTimer').hidden=m!=='timer';$('#sSw').hidden=m!=='sw';
  const f={cF:cfg.focus,cB:cfg.brk,cR:cfg.rounds,cT:cfg.timer};
  for(const id in f){const el=$('#'+id);el.disabled=!!A;if(document.activeElement!==el)el.value=f[id]}
  $('#plan').textContent=`${cfg.rounds} × ${cfg.focus} min focus = ${cfg.rounds*cfg.focus} min of study · about ${cfg.rounds*cfg.focus+(cfg.rounds-1)*cfg.brk} min including breaks`;
  $$('#chips button').forEach(b=>b.disabled=!!A);
  if(document.activeElement!==$('#subj'))$('#subj').value=A?A.subject:cfg.subject;
  render()}
$('#chips').innerHTML=[15,25,45,60,90,120].map(v=>`<button data-v="${v}">${v} min</button>`).join('');
$('#chips').onclick=e=>{const v=e.target.dataset.v;if(v&&!A){cfg.timer=+v;saveCfg();renderT()}};
$('#modes').onclick=e=>{const m=e.target.dataset.m;if(m&&!A){cfg.mode=m;saveCfg();renderT()}};
$('#subj').oninput=e=>{cfg.subject=e.target.value;if(A)A.subject=e.target.value;saveCfg();if(A)persist()};
[['cF','focus',1,240],['cB','brk',0,60],['cR','rounds',1,20],['cT','timer',1,600]].forEach(([id,k,lo,hi])=>{
 const el=$('#'+id);
 el.oninput=()=>{const v=parseInt(el.value,10);if(v>=lo&&v<=hi){cfg[k]=v;saveCfg();renderT()}};
 el.onchange=()=>{const v=parseInt(el.value,10);cfg[k]=Math.min(hi,Math.max(lo,isNaN(v)?cfg[k]:v));el.value=cfg[k];saveCfg();renderT()}});
$('#go').onclick=()=>A&&A.run?pause():start();
$('#stop').onclick=stop;
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
if(!document.fullscreenEnabled)$('#fs').hidden=true;
addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON/.test(e.target.tagName)&&!$('#vT').hidden){e.preventDefault();$('#go').click()}});
setInterval(()=>{if(!A)return;
 if(A.run){if(A.target&&elapsed()>=A.target){phaseDone();if(!A){render();return}}
  if(Date.now()-A.beat>5000){A.beat=Date.now();persist()}}
 render()},250);
addEventListener('pagehide',()=>{if(A){A.beat=Date.now();persist()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&A&&A.run)wake()});

/* tabs */
function tab(a){$('#vT').hidden=a;$('#vA').hidden=!a;$('#tT').classList.toggle('on',!a);$('#tA').classList.toggle('on',a);if(a)renderA()}
$('#tT').onclick=()=>tab(false);$('#tA').onclick=()=>tab(true);

/* analysis */
function win(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate(),o=R.off,e=[],nm=[],lb=[];let lab;
  const sd={weekday:'short',day:'numeric',month:'short'};
  if(R.range==='day'){
    const t=new Date(y,m,d+o);
    for(let i=0;i<=24;i++)e.push(new Date(t.getFullYear(),t.getMonth(),t.getDate(),i).getTime());
    for(let i=0;i<24;i++){nm.push(`${pad(i)}:00–${pad(i+1)}:00`);lb.push(i%3===0?i:'')}
    lab=t.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }else if(R.range==='week'){
    const t=new Date(y,m,d-((n.getDay()+6)%7)+7*o);
    for(let i=0;i<=7;i++)e.push(new Date(t.getFullYear(),t.getMonth(),t.getDate()+i).getTime());
    for(let i=0;i<7;i++){const x=new Date(e[i]);nm.push(x.toLocaleDateString(undefined,sd));lb.push(x.toLocaleDateString(undefined,{weekday:'short'}))}
    lab=new Date(e[0]).toLocaleDateString(undefined,sd)+' – '+new Date(e[6]).toLocaleDateString(undefined,sd);
  }else{
    const t=new Date(y,m+o,1),days=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
    for(let i=0;i<=days;i++)e.push(new Date(t.getFullYear(),t.getMonth(),1+i).getTime());
    for(let i=0;i<days;i++){nm.push(new Date(e[i]).toLocaleDateString(undefined,sd));lb.push(i===0||(i+1)%5===0?i+1:'')}
    lab=t.toLocaleDateString(undefined,{month:'long',year:'numeric'});}
  return{e,nm,lb,lab}}
function renderA(){
  $$('#rng button').forEach(b=>b.classList.toggle('on',b.dataset.r===R.range));
  const w=win(),n=w.e.length-1,b=new Array(n).fill(0),sub={},list=[];
  for(const s of sessions){const st=s.end-s.dur*1000;if(s.end<=w.e[0]||st>=w.e[n])continue;let tot=0;
   for(let i=0;i<n;i++){const ov=Math.max(0,Math.min(s.end,w.e[i+1])-Math.max(st,w.e[i]))/1000;if(ov){b[i]+=ov;tot+=ov}}
   sub[s.subject]=(sub[s.subject]||0)+tot;list.push({s,tot})}
  const total=b.reduce((a,c)=>a+c,0),cnt=list.length;
  let k=[['Total',dur(total)],['Sessions',cnt]];
  if(R.range==='day'){k.push(['Longest session',dur(Math.max(0,...list.map(x=>x.tot)))],['Avg session',cnt?dur(total/cnt):'0s'])}
  else{const now=Date.now(),dd=R.off===0?b.filter((_,i)=>w.e[i]<=now).length||1:n,bi=b.indexOf(Math.max(...b));
   k.push(['Daily average',dur(total/dd)],['Best day',total?dur(b[bi])+' · '+w.nm[bi].replace(/^\w+, /,''):'–'])}
  $('#lbl').textContent=w.lab;
  $('#kpi').innerHTML=k.map(([a,v])=>`<div class="k"><b>${v}</b><span>${a}</span></div>`).join('');
  const mx=Math.max(...b,1);
  $('#ch').innerHTML=b.map((v,i)=>`<div class="bar" data-t="${esc(w.nm[i])}: ${v?dur(v):'no study'}"><i style="height:${v?Math.max(3,Math.round(v/mx*158)):0}px"></i><span>${w.lb[i]}</span></div>`).join('');
  $('#tip').textContent=total?'Tap a bar for details':'No study time recorded in this period';
  const sk=Object.entries(sub).sort((a,c)=>c[1]-a[1]);
  $('#subjL').innerHTML=sk.length?sk.map(([s,v])=>`<div class="row"><span>${esc(s)}</span><em>${dur(v)}</em><div class="meter"><i style="width:${Math.round(v/total*100)}%"></i></div></div>`).join(''):'<p class="mut" style="margin:0">Nothing yet.</p>';
  list.sort((a,c)=>c.s.end-a.s.end);
  const tf={hour:'2-digit',minute:'2-digit'};
  $('#sesL').innerHTML=list.length?list.map(({s})=>{const st=new Date(s.end-s.dur*1000);
   return `<div class="ses"><div>${esc(s.subject)}<small>${R.range==='day'?'':st.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+' · '}${st.toLocaleTimeString([],tf)} · ${MODE[s.mode]||''}</small></div><strong>${dur(s.dur)}</strong><button data-id="${s.id}" title="Delete">✕</button></div>`}).join(''):'<p class="mut" style="margin:0">No sessions in this period.</p>'}
$('#rng').onclick=e=>{if(e.target.dataset.r){R={range:e.target.dataset.r,off:0};renderA()}};
$('#pv').onclick=()=>{R.off--;renderA()};
$('#nx').onclick=()=>{if(R.off<0){R.off++;renderA()}};
$('#ch').onclick=e=>{const b=e.target.closest('.bar');if(b)$('#tip').textContent=b.dataset.t};
$('#sesL').onclick=e=>{const id=e.target.dataset.id;if(id){cl()&&cl().del(id);sessions=sessions.filter(s=>s.id!==id);store.set('st.sessions',sessions);renderA();renderToday();fillSubjects()}};

/* installable app + offline */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{try{ip.prompt();await ip.userChoice}catch(e){}ip=null;$('#inst').hidden=true};
addEventListener('appinstalled',()=>$('#inst').hidden=true);

/* cloud sync hooks (used by the Firebase module below) */
const refreshAll=()=>{renderToday();fillSubjects();if(!$('#vA').hidden)renderA()};
window.App={cloud:null,
 getPending:()=>sessions.filter(s=>s.pending),
 getCfg:()=>cfg,
 setCfg:c=>{Object.assign(cfg,c);store.set('st.cfg',cfg);renderT()},
 applyCloud:list=>{const ids=new Set(list.map(s=>s.id));sessions=list.concat(sessions.filter(s=>s.pending&&!ids.has(s.id)));store.set('st.sessions',sessions);refreshAll()},
 clearLocal:()=>{sessions=[];store.set('st.sessions',sessions);refreshAll()}};

fillSubjects();renderToday();renderT();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,getDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import {firebaseConfig} from "./firebase-config.js";

if(!firebaseConfig.apiKey.startsWith("PASTE")){
 const $=s=>document.querySelector(s),App=window.App;
 const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore();
 let uid=null,unsub=null,ct;
 const col=()=>collection(db,'users',uid,'sessions');
 const clean=s=>{const r={...s};delete r.pending;return r};
 App.cloud={
  put:s=>uid&&setDoc(doc(col(),s.id),clean(s)).catch(console.error),
  del:id=>uid&&deleteDoc(doc(col(),id)).catch(console.error),
  cfg:c=>{if(!uid)return;clearTimeout(ct);ct=setTimeout(()=>setDoc(doc(db,'users',uid),{cfg:c},{merge:true}).catch(console.error),800)}
 };
 const msg=t=>$('#aMsg').textContent=t||'';
 const nice=e=>e.code==='auth/invalid-credential'?'Wrong email or password':e.code==='auth/email-already-in-use'?'That email already has an account — tap Sign in':e.code==='auth/weak-password'?'Password needs at least 6 characters':e.code==='auth/popup-closed-by-user'?'':(e.message||'Something went wrong').replace('Firebase: ','');
 const go=p=>{msg('');p.catch(e=>msg(nice(e)))};
 $('#aIn').onclick=()=>go(signInWithEmailAndPassword(auth,$('#aE').value.trim(),$('#aP').value));
 $('#aUp').onclick=()=>go(createUserWithEmailAndPassword(auth,$('#aE').value.trim(),$('#aP').value));
 $('#aG').onclick=()=>go(signInWithPopup(auth,new GoogleAuthProvider()));
 $('#acct').hidden=false;
 $('#acct').onclick=()=>{if(uid)signOut(auth).then(()=>App.clearLocal());else $('#auth').hidden=!$('#auth').hidden};
 onAuthStateChanged(auth,async u=>{
  unsub&&unsub();unsub=null;
  if(!u){uid=null;$('#acct').textContent='Sign in to sync';return}
  uid=u.uid;$('#auth').hidden=true;$('#acct').textContent='☁ '+(u.email||u.displayName||'Synced')+' · Sign out';
  App.getPending().forEach(s=>App.cloud.put(s));
  try{const d=await getDoc(doc(db,'users',uid));if(d.exists()&&d.data().cfg)App.setCfg(d.data().cfg);else App.cloud.cfg(App.getCfg())}catch(e){console.error(e)}
  unsub=onSnapshot(col(),snap=>App.applyCloud(snap.docs.map(d=>d.data())),e=>console.error(e));
 });
}
</script></body></html>
